[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "k11-api-contract-qa-mcp"
version = "0.1.0"
description = "MCP server and Claude Code plugin for API contract testing: consumer-aware breaking-change detection, live conformance checks and API test generation, with an audit trail."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "K11 Software Solutions" }]
requires-python = ">=3.10"
keywords = ["mcp", "openapi", "contract-testing", "api-testing", "breaking-changes", "microservices", "qa", "claude"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = ["mcp>=1.20,<2", "pyyaml>=6", "httpx>=0.27", "jsonschema>=4.20"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2"]

[project.urls]
Homepage = "https://github.com/K11-Software-Solutions/k11techlab-api-contract-qa-mcp"
Issues = "https://github.com/K11-Software-Solutions/k11techlab-api-contract-qa-mcp/issues"

[project.scripts]
k11-api-contract-qa-mcp = "k11_contract_qa.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/k11_contract_qa"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
